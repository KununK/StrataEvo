[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strataevo"
version = "0.1.0"
description = "A self-evolving agent research platform built on Tinyagent and vLLM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "accelerate==1.14.0",
    "datasets==5.0.0",
    "peft==0.19.1",
    "torch==2.11.0",
    "tqdm==4.68.4",
    "transformers==5.5.3",
    "vllm==0.25.1",
]

[project.scripts]
strataevo = "strataevo.evolution.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyagent", "src/strataevo"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"
environments = ["sys_platform == 'linux' and python_version == '3.12'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
