name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff tqdm
      - run: ruff check src eval tests
      - run: python -m pytest -q
      - run: |
          for script in scripts/*.sh eval/*.sh vllm_serve.sh; do
            bash -n "$script"
          done
